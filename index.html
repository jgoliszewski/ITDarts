<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Darts X01</title>
<style>
  :root { --bg:#0e1116; --card:#1a1f27; --fg:#e8ecf1; --muted:#8a94a3; --accent:#2f81f7; --bust:#e5534b; --win:#3fb950; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px system-ui, sans-serif; }
  header { display:flex; gap:12px; align-items:center; flex-wrap:wrap; padding:12px 16px; background:var(--card); }
  header input, header select, header button { font:inherit; padding:6px 10px; border-radius:6px; border:1px solid #333b47; background:var(--bg); color:var(--fg); }
  header button { background:var(--accent); border:0; cursor:pointer; }
  #conn { font-weight:600; }
  #conn.on { color:var(--win); } #conn.off { color:var(--bust); }
  main { display:grid; grid-template-columns:repeat(auto-fit, minmax(260px, 1fr)); gap:16px; padding:16px; }
  .p { background:var(--card); border-radius:14px; padding:20px; border:3px solid transparent; }
  .p.active { border-color:var(--accent); }
  .p.winner { border-color:var(--win); }
  .name { font-size:28px; color:var(--muted); }
  .p.active .name { color:var(--fg); }
  .score { font-size:120px; font-weight:700; line-height:1; margin:8px 0; font-variant-numeric:tabular-nums; }
  .darts { display:flex; gap:8px; min-height:44px; }
  .dart { font-size:26px; padding:4px 12px; border-radius:8px; background:#2a313c; }
  .tag { font-size:28px; font-weight:700; }
  .tag.bust { color:var(--bust); } .tag.win { color:var(--win); }
  .tools { display:flex; gap:8px; padding:0 16px 16px; flex-wrap:wrap; }
  .tools input, .tools button { font:inherit; font-size:18px; padding:8px 12px; border-radius:6px; border:1px solid #333b47; background:var(--card); color:var(--fg); }
  .tools button { cursor:pointer; }
</style>
</head>
<body>
<header>
  <span id="conn" class="off">● rozłączono</span>
  <input id="names" size="30" value="Gracz 1, Gracz 2" aria-label="Gracze (po przecinku)">
  <select id="start" aria-label="Tryb"><option>501</option><option>301</option><option>701</option></select>
  <button id="newGame">Nowa gra</button>
</header>
<main id="board"></main>
<div class="tools">
  <input id="manual" size="8" placeholder="np. T20" aria-label="Ręczny rzut">
  <button id="addDart">Dodaj rzut</button>
  <button id="next">Następny gracz</button>
  <button id="undo">Cofnij turę</button>
</div>
<script>
const BOARD = new URLSearchParams(location.search).get('board') || '192.168.1.183:3180';
let g = null, history = [], processed = 0, lastCount = 0;

function newGame(names, start) {
  g = { players: names.map(name => ({ name, score: start })), cur: 0, darts: [], busted: false, winner: null, turnStart: start };
  history = [JSON.stringify(g)];
  processed = lastCount; // ignore darts already in the board
}

// X01, double out
function applyDart(g, seg) {
  if (g.winner !== null || g.busted || g.darts.length >= 3) return;
  const p = g.players[g.cur];
  g.darts.push(seg);
  const left = p.score - seg.number * seg.multiplier;
  if (left === 0 && seg.multiplier === 2) { p.score = 0; g.winner = g.cur; }
  else if (left <= 1) { g.busted = true; p.score = g.turnStart; }
  else p.score = left;
}

function nextTurn() {
  if (g.winner !== null) return;
  g.cur = (g.cur + 1) % g.players.length;
  g.darts = []; g.busted = false; g.turnStart = g.players[g.cur].score;
  history.push(JSON.stringify(g));
}

function onState(s) {
  const throws = s.throws || [];
  lastCount = throws.length;
  if (!g) return;
  if (s.event === 'Takeout finished') { if (g.darts.length) nextTurn(); processed = 0; }
  else if (throws.length < processed) processed = throws.length; // manual reset on the board
  for (; processed < throws.length; processed++) applyDart(g, throws[processed].segment);
  render();
}

function parseDart(txt) {
  const t = txt.trim().toUpperCase();
  if (t === 'BULL' || t === '50' || t === 'DB') return { name: 'D25', number: 25, multiplier: 2 };
  if (t === '25' || t === 'SB') return { name: 'S25', number: 25, multiplier: 1 };
  const m = t.match(/^([SDT]?)(\d{1,2})$/);
  if (!m || +m[2] > 20) return null;
  const multiplier = { '': 1, S: 1, D: 2, T: 3 }[m[1]];
  return { name: (m[1] || 'S') + m[2], number: +m[2], multiplier: +m[2] === 0 ? 1 : multiplier };
}

const label = s => s.number === 0 ? 'Miss' : s.number === 25 ? (s.multiplier === 2 ? 'BULL' : '25') : s.name;

function render() {
  const el = document.getElementById('board');
  if (!g) { el.innerHTML = ''; return; }
  el.innerHTML = g.players.map((p, i) => {
    const active = i === g.cur && g.winner === null;
    const tag = g.winner === i ? '<span class="tag win">WYGRANA!</span>'
      : active && g.busted ? '<span class="tag bust">BUST</span>' : '';
    const darts = active || g.winner === i ? g.darts.map(d => `<span class="dart">${label(d)}</span>`).join('') : '';
    return `<section class="p ${active ? 'active' : ''} ${g.winner === i ? 'winner' : ''}">
      <div class="name"></div><div class="score">${p.score}</div><div class="darts">${darts}</div>${tag}</section>`;
  }).join('');
  el.querySelectorAll('.name').forEach((n, i) => n.textContent = g.players[i].name);
}

function setConn(on) {
  const c = document.getElementById('conn');
  c.className = on ? 'on' : 'off';
  c.textContent = on ? `● tarcza ${BOARD}` : '● rozłączono, ponawiam…';
}

function connect() {
  const ws = new WebSocket(`ws://${BOARD}/api/events`);
  ws.onopen = () => setConn(true);
  ws.onclose = () => { setConn(false); setTimeout(connect, 2000); };
  ws.onmessage = e => { const m = JSON.parse(e.data); if (m.type === 'state') onState(m.data); };
}

document.getElementById('newGame').onclick = () => {
  const names = document.getElementById('names').value.split(',').map(s => s.trim()).filter(Boolean);
  newGame(names.length ? names : ['Gracz 1'], +document.getElementById('start').value);
  render();
};
document.getElementById('addDart').onclick = () => {
  const inp = document.getElementById('manual'), seg = g && parseDart(inp.value);
  if (!seg) { inp.select(); return; }
  applyDart(g, seg); inp.value = ''; render();
};
document.getElementById('manual').onkeydown = e => { if (e.key === 'Enter') document.getElementById('addDart').click(); };
document.getElementById('next').onclick = () => { if (g) { nextTurn(); render(); } };
document.getElementById('undo').onclick = () => {
  if (!g) return;
  if (!g.darts.length && history.length > 1) history.pop();
  g = JSON.parse(history[history.length - 1]);
  render();
};

// self-check of the scoring rules (see console)
(() => {
  const mk = s => ({ players: [{ score: s }], cur: 0, darts: [], busted: false, winner: null, turnStart: s });
  let t = mk(40); applyDart(t, { number: 20, multiplier: 1 }); applyDart(t, { number: 10, multiplier: 2 });
  console.assert(t.winner === 0, 'D10 checkout wins');
  t = mk(40); applyDart(t, { number: 20, multiplier: 1 }); applyDart(t, { number: 20, multiplier: 1 });
  console.assert(t.busted && t.players[0].score === 40, 'single out busts');
  t = mk(40); applyDart(t, { number: 13, multiplier: 3 });
  console.assert(t.busted && t.players[0].score === 40, 'leaving 1 busts');
  console.assert(parseDart('t20').multiplier === 3 && parseDart('bull').number === 25 && !parseDart('T21'), 'parseDart');
})();

connect();
</script>
</body>
</html>
